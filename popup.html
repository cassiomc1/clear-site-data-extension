<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{width:320px;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#1a1a2e;color:#eee}
    .container{padding:20px}
    h1{font-size:18px;margin-bottom:10px;color:#e94560;text-align:center}
    .site-info{font-size:12px;color:#aaa;text-align:center;margin-bottom:15px;word-break:break-all}
    .options{display:flex;flex-direction:column;gap:8px;margin-bottom:15px}
    .options label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:4px;border-radius:4px;transition:background .2s}
    .options label:hover{background:rgba(255,255,255,.05)}
    .options input[type="checkbox"]{width:16px;height:16px;accent-color:#e94560}
    .clear-btn{width:100%;padding:12px;background:#e94560;color:white;border:none;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;transition:background .2s}
    .clear-btn:hover{background:#c73659}
    .clear-btn:disabled{background:#555;cursor:not-allowed}
    .status{margin-top:10px;font-size:12px;text-align:center;min-height:18px}
    .status.success{color:#4ecca3}
    .status.error{color:#e94560}
  </style>
</head>
<body>
  <div class="container">
    <h1>Limpar Dados do Site</h1>
    <p class="site-info" id="siteInfo">Carregando...</p>

    <div class="options">
      <label><input type="checkbox" id="cookies" checked> Cookies</label>
      <label><input type="checkbox" id="cache" checked> Cache</label>
      <label><input type="checkbox" id="localStorage" checked> Local Storage</label>
      <label><input type="checkbox" id="sessionStorage" checked> Session Storage</label>
      <label><input type="checkbox" id="indexedDB" checked> IndexedDB</label>
    </div>

    <button id="clearBtn" class="clear-btn">Limpar Dados</button>
    <div id="status" class="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
