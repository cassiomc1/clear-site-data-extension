<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Limpar Dados do Site</h1>
    <p class="site-info" id="siteInfo">Carregando...</p>

    <div class="options">
      <label><input type="checkbox" id="cookies" checked> Cookies</label>
      <label><input type="checkbox" id="cacheStorage" checked> Cache Storage</label>
      <label><input type="checkbox" id="localStorage" checked> Local Storage</label>
      <label><input type="checkbox" id="serviceWorkers" checked> Service Workers</label>
      <label><input type="checkbox" id="indexedDB" checked> IndexedDB</label>
    </div>

    <button id="clearBtn" class="clear-btn">Limpar Dados</button>
    <div id="status" class="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
